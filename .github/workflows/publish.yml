name: Publish long-haul fares

# Daily: one collect job per origin (in parallel, independent) → merge → validate →
# commit to the `data` branch (history) → deploy GitHub Pages.
# An origin that fails keeps its last published list; if nothing is publishable, nothing changes.
on:
  schedule:
    - cron: '37 0 * * *'   # night (UTC): Google's search answers best then; odd minute, GitHub may start it late
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        origin: [SKG, ATH, EVN, STN]
    runs-on: ubuntu-latest
    timeout-minutes: 240   # verification stops itself at 210 min (VERIFY.deadlineMin); public repo = free minutes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect
        env:
          ORIGIN: ${{ matrix.origin }}
        run: node collect.mjs --origins "$ORIGIN" --out part --data data

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.origin }}
          path: part/
          retention-days: 7

  publish:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push to the data branch
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Merge origins
        run: node merge.mjs parts data out

      - name: Validate (refuses to publish a broken or near-empty result)
        run: node validate.mjs out

      - name: Commit to data branch
        run: |
          DAY=$(date -u +%F)
          mkdir -p data/v2 data/history2 data/cache
          cp out/v2/*.json data/v2/
          cp out/cache/*.json data/cache/ 2>/dev/null || true
          cp out/names.json data/names.json
          cp out/history-entry.json "data/history2/${DAY}.json"
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "data: ${DAY}" || echo "nothing to commit"
          git push -q origin HEAD:data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
